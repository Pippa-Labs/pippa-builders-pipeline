name: Hackathon app check
description: Steps of the prepare, SDK and check jobs of the hackathon publish workflow, one per mode (prepare, sdk-fetch, sdk-install, check; sdk and clear for re-runs of the workflow before the split, until 2026-12-20)

inputs:
  mode:
    description: prepare (prepare job), sdk-fetch (SDK job), sdk-install or check (check job); sdk (refuses) and clear (blanks the AWS credentials) only for the check job of the workflow made before the split, remove after 2026-12-20
    required: true
  log_level:
    description: Global log level (DEBUG, INFO, WARN, ERROR)
    required: false
    default: INFO
  handover_key:
    description: Key of this run's sealed SDK hand-over, the SDK job's output (mode sdk-install only)
    required: false
    default: ""

outputs:
  handover_key:
    description: Key that opens this run's sealed SDK hand-over (mode sdk-fetch)
    value: ${{ steps.fetch.outputs.handover_key }}
  ready:
    description: false when there is nothing to publish yet (placeholder app id or blank app_author_name) and nothing was refused (mode prepare)
    value: ${{ steps.prepare.outputs.ready }}
  verdict:
    description: passed or failed (modes prepare and check)
    value: ${{ steps.prepare.outputs.verdict || steps.check.outputs.verdict }}
  details:
    description: Failing lines (modes prepare and check)
    value: ${{ steps.prepare.outputs.details || steps.check.outputs.details }}
  warnings:
    description: Non-blocking warnings of the personal data check (mode prepare), or of scripts/check.py and scripts/routing_check.py (mode check)
    value: ${{ steps.prepare.outputs.warnings || steps.check.outputs.warnings }}

runs:
  using: composite
  steps:
    - name: Check for personal data, keys and the dependencies
      id: prepare
      if: inputs.mode == 'prepare'
      shell: bash
      env:
        LOG_LEVEL: ${{ inputs.log_level }}
      run: bash "${{ github.action_path }}/scripts/prepare.sh"

    - name: Fetch the Pippa SDK
      id: fetch
      if: inputs.mode == 'sdk-fetch'
      shell: bash
      env:
        LOG_LEVEL: ${{ inputs.log_level }}
      run: bash "${{ github.action_path }}/scripts/fetch-sdk.sh"

    # The only step that gets the key: the app's code runs in a later step of the same job.
    - name: Install the Pippa SDK
      if: inputs.mode == 'sdk-install'
      shell: bash
      env:
        HANDOVER_KEY: ${{ inputs.handover_key }}
        LOG_LEVEL: ${{ inputs.log_level }}
      run: bash "${{ github.action_path }}/scripts/install-sdk.sh"

    - name: Check the app
      id: check
      if: inputs.mode == 'check'
      shell: bash
      env:
        LOG_LEVEL: ${{ inputs.log_level }}
      run: bash "${{ github.action_path }}/scripts/check-app.sh"

    # Remove after 2026-12-20: modes sdk and clear. The workflow made before the check was split
    # into the prepare, SDK and check jobs ran prepare, sdk, clear and check in one job, and a
    # re-run of single jobs of one of its runs (allowed for 30 days) replays it with this action
    # @main. Without these steps both modes would do nothing: the SDK read role's credentials
    # would stay in that job to its end, and only check-app.sh's own guard would keep the app's
    # code from running next to them, reported as a platform error.
    - name: Refuse the workflow made before the split (remove after 2026-12-20)
      if: inputs.mode == 'sdk'
      shell: bash
      env:
        LOG_LEVEL: ${{ inputs.log_level }}
      run: bash "${{ github.action_path }}/scripts/refuse-old-workflow.sh"

    - name: Remove the credentials (remove after 2026-12-20)
      if: inputs.mode == 'clear'
      shell: bash
      env:
        LOG_LEVEL: ${{ inputs.log_level }}
      run: bash "${{ github.action_path }}/scripts/clear-credentials.sh"
